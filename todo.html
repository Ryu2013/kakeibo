<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やることリスト</title>
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#f5f3ef">
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #888;
    --accent: #d97757;
    --aoi: #6ba3c9;
    --border: #e5e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header { padding: 20px 16px 12px; text-align: center; }
  header h1 { margin: 0; font-size: 1.3rem; }
  [hidden] { display: none !important; }
  .container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .hamburger-btn {
    position: fixed; top: 14px; left: 14px; z-index: 50;
    width: 40px; height: 40px; border-radius: 10px; border: none;
    background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    font-size: 1.2rem; cursor: pointer;
  }
  .reload-btn {
    position: fixed; top: 14px; right: 14px; z-index: 50;
    width: 40px; height: 40px; border-radius: 10px; border: none;
    background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    font-size: 1.2rem; cursor: pointer;
  }
  .menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 60; }
  .menu-drawer {
    position: fixed; top: 0; left: 0; height: 100%; width: 260px; max-width: 80%;
    background: var(--card); z-index: 70; box-shadow: 2px 0 12px rgba(0,0,0,0.15);
    transform: translateX(-100%); transition: transform 0.25s ease;
    padding: 60px 12px 16px; display: flex; flex-direction: column; gap: 4px;
  }
  .menu-drawer.open { transform: translateX(0); }
  .menu-user {
    font-weight: bold; padding: 10px 10px 14px; color: var(--text);
    border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  .menu-item {
    display: block; width: 100%; text-align: left; padding: 12px 10px;
    border: none; background: none; font-size: 0.95rem; color: var(--text);
    text-decoration: none; border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  .menu-item:active { background: var(--bg); }

  .open-entry-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .section-title { font-size: 0.85rem; color: var(--muted); margin: 20px 0 8px; }

  ul.list { list-style: none; padding: 0; margin: 0; }
  li.item {
    background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  li.item.done { opacity: 0.5; }
  li.item.draft-item {
    background: #fffaf5; border: 1px dashed var(--border); box-shadow: none;
  }
  li.item .check {
    width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent);
  }
  li.item .desc { flex: 1; cursor: pointer; word-break: break-all; }
  li.item.done .desc { text-decoration: line-through; }
  li.item .draft-remove {
    border: none; background: none; color: var(--muted); font-size: 1.1rem;
    cursor: pointer; padding: 4px;
  }
  .empty { text-align: center; color: var(--muted); padding: 20px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 100; overflow-y: auto;
  }
  .modal-card {
    background: var(--card); border-radius: 16px; padding: 24px; max-width: 340px;
    width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin: auto;
    position: relative; text-align: left;
  }
  .modal-card h2 { margin: 0 0 16px; font-size: 1.2rem; text-align: center; }
  .modal-card input {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 1rem; margin-bottom: 14px;
  }
  .modal-close {
    position: absolute; top: 10px; left: 10px; width: 32px; height: 32px;
    border: none; background: none; font-size: 1.5rem; line-height: 1;
    color: var(--muted); cursor: pointer; padding: 0;
  }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  button.submit {
    padding: 12px; border: none; border-radius: 10px; background: var(--text);
    color: #fff; font-size: 1rem; cursor: pointer; margin-top: 0;
  }
  button.danger { background: #c0392b; }
  .pending-header { font-size: 0.85rem; color: var(--muted); margin: 4px 0 8px; }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 300;
  }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--border);
    border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #2b2b2b; color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 0.85rem; z-index: 200; max-width: 90%; text-align: center;
  }
</style>
</head>
<body>
<button class="hamburger-btn" id="menuBtn" type="button" aria-label="メニュー" hidden>☰</button>
<button class="reload-btn" id="reloadBtn" type="button" aria-label="再読み込み">⟳</button>
<div class="menu-backdrop" id="menuBackdrop" hidden></div>
<nav class="menu-drawer" id="menuDrawer">
  <div class="menu-user" id="menuUser">-</div>
  <a class="menu-item" href="index.html">家計簿</a>
  <a class="menu-item" href="graph.html">家計簿グラフ</a>
  <a class="menu-item" href="shopping.html">買い物リスト</a>
  <button class="menu-item" id="logoutBtn" type="button">ログアウト</button>
</nav>

<header>
  <h1>やることリスト</h1>
</header>

<div class="container" id="app" hidden>
  <button class="open-entry-btn" id="openEntryBtn" type="button">＋ やることを追加</button>

  <div class="section-title">未完了</div>
  <ul class="list" id="notDoneList">
    <li class="empty">読み込み中...</li>
  </ul>

  <div class="section-title" id="doneTitle" hidden>完了済み（7日で自動的に消えます）</div>
  <ul class="list" id="doneList"></ul>
</div>

<div class="overlay" id="entryOverlay" hidden>
  <div class="modal-card">
    <button class="modal-close" id="entryCloseBtn" type="button" aria-label="閉じる">×</button>
    <h2>やることを追加</h2>
    <form id="entryForm">
      <div class="row">
        <input type="text" id="fDesc" placeholder="やること" autocomplete="off" required>
      </div>
      <div class="row">
        <button type="submit" class="submit" style="flex: 1;">追加</button>
        <button type="button" class="submit" id="sendBtn" style="flex: 1; background: var(--accent);">送信する</button>
      </div>
    </form>

    <div class="pending-section" id="draftSection" hidden>
      <div class="pending-header">未送信 (<span id="draftCount">0</span>件)</div>
      <ul class="list" id="draftList"></ul>
    </div>
  </div>
</div>

<div class="overlay" id="editOverlay" hidden>
  <div class="modal-card">
    <button class="modal-close" id="editCloseBtn" type="button" aria-label="閉じる">×</button>
    <h2>編集</h2>
    <form id="editForm">
      <input type="text" id="eDesc" required>
      <div class="row">
        <button type="submit" class="submit">更新する</button>
        <button type="button" class="submit danger" id="editDeleteBtn">削除する</button>
      </div>
    </form>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxwMA2biwcJz5GbjjR5xyYwqSbw6cRSE5sA-aRtwQg0_bO7s1zU6H03NKZiZVfMU50-/exec';
  const STORAGE_KEY = 'kakeibo_passphrase';
  const LOGIN_ID_KEY = 'kakeibo_login_id';
  const DRAFT_KEY = 'todo_draft';
  const LOGIN_ID_TO_PAYER = { aoi: '碧', ryu: '竜' };

  let items = [];
  let draft = loadDraft_();
  let editingId = null;

  const appEl = document.getElementById('app');
  const openEntryBtn = document.getElementById('openEntryBtn');
  const notDoneList = document.getElementById('notDoneList');
  const doneList = document.getElementById('doneList');
  const doneTitle = document.getElementById('doneTitle');

  const entryOverlay = document.getElementById('entryOverlay');
  const entryForm = document.getElementById('entryForm');
  const entryCloseBtn = document.getElementById('entryCloseBtn');
  const fDesc = document.getElementById('fDesc');
  const sendBtn = document.getElementById('sendBtn');
  const draftSection = document.getElementById('draftSection');
  const draftList = document.getElementById('draftList');
  const draftCount = document.getElementById('draftCount');

  const editOverlay = document.getElementById('editOverlay');
  const editForm = document.getElementById('editForm');
  const editCloseBtn = document.getElementById('editCloseBtn');
  const eDesc = document.getElementById('eDesc');
  const editDeleteBtn = document.getElementById('editDeleteBtn');

  const loadingOverlay = document.getElementById('loadingOverlay');
  const toast = document.getElementById('toast');

  const menuBtn = document.getElementById('menuBtn');
  const menuBackdrop = document.getElementById('menuBackdrop');
  const menuDrawer = document.getElementById('menuDrawer');
  const menuUser = document.getElementById('menuUser');
  const logoutBtn = document.getElementById('logoutBtn');
  const reloadBtn = document.getElementById('reloadBtn');

  reloadBtn.addEventListener('click', () => location.reload());

  function getPassphrase_() { return localStorage.getItem(STORAGE_KEY) || ''; }
  function clearPassphrase_() {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(LOGIN_ID_KEY);
  }
  function showLoading_() { loadingOverlay.hidden = false; }
  function hideLoading_() { loadingOverlay.hidden = true; }
  function showToast_(msg) {
    toast.textContent = msg;
    toast.hidden = false;
    clearTimeout(showToast_._t);
    showToast_._t = setTimeout(() => { toast.hidden = true; }, 2500);
  }
  function escapeHtml_(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function loadDraft_() {
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveDraft_() {
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  }

  function openMenu_() { menuDrawer.classList.add('open'); menuBackdrop.hidden = false; }
  function closeMenu_() { menuDrawer.classList.remove('open'); menuBackdrop.hidden = true; }
  menuBtn.addEventListener('click', openMenu_);
  menuBackdrop.addEventListener('click', closeMenu_);
  logoutBtn.addEventListener('click', () => {
    clearPassphrase_();
    location.href = 'index.html';
  });

  function renderList_() {
    const notDone = items.filter(it => !it.done);
    const done = items.filter(it => it.done);

    notDoneList.innerHTML = notDone.length
      ? notDone.map(itemRow_).join('')
      : '<li class="empty">やることはありません</li>';

    doneTitle.hidden = done.length === 0;
    doneList.innerHTML = done.map(itemRow_).join('');
  }

  function itemRow_(it) {
    return (
      '<li class="item' + (it.done ? ' done' : '') + '" data-id="' + it.id + '">' +
      '<input type="checkbox" class="check" data-id="' + it.id + '"' + (it.done ? ' checked' : '') + '>' +
      '<span class="desc" data-id="' + it.id + '">' + escapeHtml_(it.desc) + '</span>' +
      '</li>'
    );
  }

  function renderDraft_() {
    draftSection.hidden = draft.length === 0;
    draftCount.textContent = draft.length;
    draftList.innerHTML = draft.map(d => (
      '<li class="item draft-item" data-local-id="' + d.localId + '">' +
      '<span class="desc">' + escapeHtml_(d.desc) + '</span>' +
      '<button class="draft-remove" data-local-id="' + d.localId + '">✕</button>' +
      '</li>'
    )).join('');
    openEntryBtn.textContent = draft.length
      ? '＋ やることを追加 (' + draft.length + '件未送信)'
      : '＋ やることを追加';
  }

  // チェックのON/OFFは体感速度優先で楽観的更新(即座に見た目を変えてから通信)。
  // 失敗時だけ元に戻してトーストで知らせる。
  document.addEventListener('click', async (e) => {
    const check = e.target.closest('.check');
    if (!check) return;
    const id = check.dataset.id;
    const item = items.find(it => it.id === id);
    if (!item) return;
    const done = check.checked;
    item.done = done;
    renderList_();
    const data = await postAction_({ action: 'todoToggle', id, done });
    if (data) {
      items = data.todoItems;
    } else {
      item.done = !done;
    }
    renderList_();
  });

  document.addEventListener('click', (e) => {
    const desc = e.target.closest('#notDoneList .desc, #doneList .desc');
    if (!desc) return;
    const item = items.find(it => it.id === desc.dataset.id);
    if (!item) return;
    editingId = item.id;
    eDesc.value = item.desc;
    editOverlay.hidden = false;
  });

  editCloseBtn.addEventListener('click', () => {
    editOverlay.hidden = true;
    editingId = null;
  });

  editForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!editingId) return;
    showLoading_();
    try {
      const data = await postAction_({ action: 'todoUpdate', id: editingId, desc: eDesc.value });
      if (data) {
        items = data.todoItems;
        renderList_();
        editOverlay.hidden = true;
        editingId = null;
        showToast_('更新しました');
      }
    } finally {
      hideLoading_();
    }
  });

  editDeleteBtn.addEventListener('click', async () => {
    if (!editingId) return;
    showLoading_();
    try {
      const data = await postAction_({ action: 'todoDelete', id: editingId });
      if (data) {
        items = data.todoItems;
        renderList_();
        editOverlay.hidden = true;
        editingId = null;
        showToast_('削除しました');
      }
    } finally {
      hideLoading_();
    }
  });

  openEntryBtn.addEventListener('click', () => {
    entryOverlay.hidden = false;
    fDesc.focus();
  });
  entryCloseBtn.addEventListener('click', () => {
    entryOverlay.hidden = true;
  });

  // 「追加」はローカルの未送信リストに積むだけ。通信は「送信する」でまとめて行う。
  entryForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const desc = fDesc.value.trim();
    if (!desc) return;
    draft.push({ localId: 'd' + Date.now() + Math.random().toString(36).slice(2, 7), desc });
    saveDraft_();
    renderDraft_();
    fDesc.value = '';
    fDesc.focus();
  });

  draftList.addEventListener('click', (e) => {
    const btn = e.target.closest('.draft-remove');
    if (!btn) return;
    draft = draft.filter(d => d.localId !== btn.dataset.localId);
    saveDraft_();
    renderDraft_();
  });

  sendBtn.addEventListener('click', async () => {
    if (!draft.length) return;
    showLoading_();
    try {
      const data = await postAction_({
        action: 'todoAdd',
        items: draft.map(d => ({ desc: d.desc })),
      });
      if (data) {
        draft = [];
        saveDraft_();
        renderDraft_();
        items = data.todoItems;
        renderList_();
        entryOverlay.hidden = true;
        showToast_('送信しました');
      }
    } finally {
      hideLoading_();
    }
  });

  async function postAction_(payload) {
    let res;
    try {
      res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ passphrase: getPassphrase_() }, payload)),
      });
    } catch (err) {
      showToast_('通信エラーが発生しました。もう一度お試しください');
      return null;
    }
    let data;
    try {
      data = await res.json();
    } catch (err) {
      showToast_('通信エラーが発生しました。もう一度お試しください');
      return null;
    }
    if (data.error === '合言葉が違います') {
      clearPassphrase_();
      location.href = 'index.html';
      return null;
    }
    if (data.error) {
      showToast_('エラー: ' + data.error);
      return null;
    }
    return data;
  }

  async function main_() {
    const passphrase = getPassphrase_();
    if (!passphrase) {
      location.href = 'index.html';
      return;
    }
    const loginId = localStorage.getItem(LOGIN_ID_KEY);
    if (loginId) {
      menuUser.textContent = 'ログイン中: ' + (LOGIN_ID_TO_PAYER[loginId] || loginId);
    }
    menuBtn.hidden = false;
    renderDraft_();

    let data;
    try {
      const res = await fetch(GAS_URL + '?passphrase=' + encodeURIComponent(passphrase) + '&list=todo');
      data = await res.json();
    } catch (err) {
      hideLoading_();
      showToast_('通信エラーが発生しました');
      return;
    }
    if (data.error) {
      location.href = 'index.html';
      return;
    }
    items = data.items;
    renderList_();
    appEl.hidden = false;
    hideLoading_();
  }

  main_();
</script>
</body>
</html>
