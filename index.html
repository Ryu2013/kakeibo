<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家計簿アプリ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f5f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #888;
    --accent: #d97757;
    --aoi: #6ba3c9;
    --border: #e5e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header { padding: 20px 16px 4px; text-align: center; }
  header h1 { margin: 0; font-size: 1.3rem; }
  [hidden] { display: none !important; }
  .container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .reload-btn {
    position: fixed; top: 14px; right: 14px; z-index: 50;
    width: 40px; height: 40px; border-radius: 10px; border: none;
    background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    font-size: 1.2rem; cursor: pointer;
  }

  .who-am-i {
    text-align: center; font-size: 0.85rem; color: var(--muted); margin: 16px 0 20px;
  }

  .hub-btn {
    display: block; width: 100%; padding: 18px; margin-bottom: 12px;
    border: none; border-radius: 12px; background: var(--card); color: var(--text);
    font-size: 1.05rem; font-weight: 500; text-align: center; text-decoration: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer; font-family: inherit;
  }
  .hub-btn:active { background: #eee; }
  .hub-logout {
    background: none; border: 1px solid var(--border); color: var(--muted);
    margin-top: 12px; box-shadow: none;
  }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .toggle-group { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; text-align: center; cursor: pointer; user-select: none; font-size: 0.95rem;
  }
  .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toggle-btn.active.aoi { background: var(--aoi); border-color: var(--aoi); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 100; overflow-y: auto;
  }
  .modal-card {
    background: var(--card); border-radius: 16px; padding: 24px; max-width: 340px;
    width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin: auto;
  }
  .modal-card h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .modal-card p { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
  .modal-card input {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 1rem; margin-bottom: 12px; text-align: center;
  }
  .error-text { color: #c0392b; font-size: 0.85rem; min-height: 1.2em; margin: 0 0 8px; }
  button.submit {
    width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--text);
    color: #fff; font-size: 1rem; cursor: pointer; margin-top: 4px;
  }
  button.submit:disabled { opacity: 0.5; }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 300;
  }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--border);
    border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #2b2b2b; color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 0.85rem; z-index: 200; max-width: 90%; text-align: center;
  }
</style>
</head>
<body>
<button class="reload-btn" id="reloadBtn" type="button" aria-label="再読み込み">⟳</button>

<header>
  <h1>家計簿アプリ</h1>
</header>

<div class="container" id="hub" hidden>
  <div class="who-am-i" id="whoAmI"></div>
  <a class="hub-btn" href="kakeibo.html">家計簿</a>
  <a class="hub-btn" href="graph.html">家計簿グラフ</a>
  <a class="hub-btn" href="shopping.html">買い物リスト</a>
  <a class="hub-btn" href="todo.html">やることリスト</a>
  <button class="hub-btn hub-logout" id="logoutBtn" type="button">ログアウト</button>
</div>

<div class="overlay" id="loginOverlay" hidden>
  <div class="modal-card">
    <h2>家計簿</h2>
    <p>ログインIDと合言葉を入力してください</p>
    <form id="loginForm">
      <div class="toggle-group" id="loginIdGroup" style="margin-bottom: 12px;">
        <div class="toggle-btn aoi active" data-value="aoi">碧</div>
        <div class="toggle-btn" data-value="ryu">竜</div>
      </div>
      <input type="password" id="loginInput" placeholder="合言葉" autocomplete="off" autocapitalize="off">
      <p class="error-text" id="loginError"></p>
      <button type="submit" class="submit" id="loginBtn">入る</button>
    </form>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxwMA2biwcJz5GbjjR5xyYwqSbw6cRSE5sA-aRtwQg0_bO7s1zU6H03NKZiZVfMU50-/exec';
  const STORAGE_KEY = 'kakeibo_passphrase';
  const LOGIN_ID_KEY = 'kakeibo_login_id';
  const LOGIN_ID_TO_PAYER = { aoi: '碧', ryu: '竜' };

  const state = { loginId: 'aoi' };

  const hub = document.getElementById('hub');
  const whoAmI = document.getElementById('whoAmI');
  const logoutBtn = document.getElementById('logoutBtn');

  const loginOverlay = document.getElementById('loginOverlay');
  const loginForm = document.getElementById('loginForm');
  const loginInput = document.getElementById('loginInput');
  const loginError = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');

  const loadingOverlay = document.getElementById('loadingOverlay');
  const toast = document.getElementById('toast');
  const reloadBtn = document.getElementById('reloadBtn');
  reloadBtn.addEventListener('click', () => location.reload());

  function getPassphrase_() { return localStorage.getItem(STORAGE_KEY) || ''; }
  function clearPassphrase_() {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(LOGIN_ID_KEY);
  }
  function showLoading_() { loadingOverlay.hidden = false; }
  function hideLoading_() { loadingOverlay.hidden = true; }
  function showToast_(msg) {
    toast.textContent = msg;
    toast.hidden = false;
    clearTimeout(showToast_._t);
    showToast_._t = setTimeout(() => { toast.hidden = true; }, 2500);
  }

  // --- ログインID (aoi/ryu) の切り替え ---
  document.getElementById('loginIdGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    state.loginId = btn.dataset.value;
    renderLoginIdToggle_();
  });
  function renderLoginIdToggle_() {
    document.querySelectorAll('#loginIdGroup .toggle-btn').forEach(b => {
      const active = b.dataset.value === state.loginId;
      b.classList.toggle('active', active);
      b.classList.toggle('aoi', active && b.dataset.value === 'aoi');
    });
  }

  function showHub_(loginId) {
    whoAmI.textContent = 'ログイン中: ' + (LOGIN_ID_TO_PAYER[loginId] || loginId);
    loginOverlay.hidden = true;
    hub.hidden = false;
  }

  // ログイン確認は合言葉のチェックだけの軽量な通信(list=ping)。
  // 家計簿・買い物リストなどのデータは各ページ側で必要な時に取得する。
  async function verifyPassphrase_(passphrase) {
    const url = GAS_URL + '?passphrase=' + encodeURIComponent(passphrase) + '&list=ping';
    const res = await fetch(url);
    return res.json();
  }

  async function tryEnter_(loginId, passphrase, showError) {
    loginBtn.disabled = true;
    loginBtn.textContent = '確認中...';
    try {
      const data = await verifyPassphrase_(passphrase);
      if (data.error) {
        if (showError) loginError.textContent = data.error;
        return false;
      }
      localStorage.setItem(STORAGE_KEY, passphrase);
      localStorage.setItem(LOGIN_ID_KEY, loginId);
      showHub_(loginId);
      return true;
    } catch (err) {
      if (showError) showToast_('通信エラーが発生しました');
      return false;
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = '入る';
    }
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    const ok = await tryEnter_(state.loginId, loginInput.value, true);
    if (!ok) loginInput.value = '';
  });

  logoutBtn.addEventListener('click', () => {
    clearPassphrase_();
    hub.hidden = true;
    loginOverlay.hidden = false;
    loginInput.value = '';
    loginInput.focus();
  });

  // 初回ロード: 保存済みのログインID・合言葉があれば自動でホームを表示
  (async function init_() {
    const savedId = localStorage.getItem(LOGIN_ID_KEY);
    const savedPass = getPassphrase_();
    if (savedId) {
      state.loginId = savedId;
      renderLoginIdToggle_();
    }
    if (savedId && savedPass) {
      const ok = await tryEnter_(savedId, savedPass, false);
      if (ok) {
        hideLoading_();
        return;
      }
    }
    hideLoading_();
    loginOverlay.hidden = false;
    loginInput.focus();
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
